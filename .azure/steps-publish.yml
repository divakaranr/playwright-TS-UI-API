# Publishes JUnit results, HTML report, Allure results and (on failure) traces/screenshots/videos.
parameters:
  - name: name
    type: string

steps:
  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: reports/junit.xml
      testRunTitle: Playwright ${{ parameters.name }} ($(TEST_ENV))
      mergeTestResults: true
      failTaskOnFailedTests: true
  - task: PublishPipelineArtifact@1
    displayName: Publish HTML report
    condition: succeededOrFailed()
    inputs:
      targetPath: reports/html
      artifact: html-report-${{ parameters.name }}-$(System.JobAttempt)
  - task: PublishPipelineArtifact@1
    displayName: Publish Allure results
    condition: succeededOrFailed()
    inputs:
      targetPath: reports/allure-results
      artifact: allure-${{ parameters.name }}-$(System.JobAttempt)
  - task: PublishPipelineArtifact@1
    displayName: Publish failure diagnostics
    condition: failed()
    inputs:
      targetPath: test-results
      artifact: diagnostics-${{ parameters.name }}-$(System.JobAttempt)
